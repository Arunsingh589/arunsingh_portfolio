<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="Poppins, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0a24"/>
      <stop offset="1" stop-color="#1d1145"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00cea8"/>
      <stop offset="1" stop-color="#bf61ff"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" opacity=".08"/>
    </pattern>
  </defs>
  <rect width="720" height="460" fill="url(#bg)"/>
  <rect width="720" height="460" fill="url(#grid)"/>

  <g fill="none" stroke="url(#accent)" stroke-width="2.5" opacity=".85">
    <path d="M190 160 C 250 160, 250 110, 300 110"/>
    <path d="M190 160 C 250 160, 250 250, 300 250"/>
    <path d="M440 110 C 490 110, 490 180, 530 180"/>
    <path d="M440 250 C 490 250, 490 180, 530 180"/>
    <path d="M600 210 C 600 290, 440 300, 440 350" stroke-dasharray="6 6"/>
  </g>

  <g font-size="15" fill="#fff">
    <rect x="50" y="128" width="140" height="64" rx="14" fill="#151030" stroke="#00cea8" stroke-width="2"/>
    <text x="120" y="156" text-anchor="middle" font-weight="700">User Query</text>
    <text x="120" y="176" text-anchor="middle" font-size="11" fill="#aaa6c3">SSE stream</text>

    <rect x="300" y="78" width="140" height="64" rx="14" fill="#151030" stroke="#7c6cff" stroke-width="2"/>
    <text x="370" y="106" text-anchor="middle" font-weight="700">RAG Retriever</text>
    <text x="370" y="126" text-anchor="middle" font-size="11" fill="#aaa6c3">ChromaDB · Nomic</text>

    <rect x="300" y="218" width="140" height="64" rx="14" fill="#151030" stroke="#7c6cff" stroke-width="2"/>
    <text x="370" y="246" text-anchor="middle" font-weight="700">Tool Router</text>
    <text x="370" y="266" text-anchor="middle" font-size="11" fill="#aaa6c3">LangGraph node</text>

    <rect x="530" y="148" width="140" height="64" rx="14" fill="#151030" stroke="#bf61ff" stroke-width="2"/>
    <text x="600" y="176" text-anchor="middle" font-weight="700">LLM Router</text>
    <text x="600" y="196" text-anchor="middle" font-size="11" fill="#aaa6c3">OpenAI · Groq · OR</text>

    <rect x="370" y="350" width="140" height="56" rx="14" fill="#151030" stroke="#00cea8" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="440" y="383" text-anchor="middle" font-weight="700">Memory</text>
  </g>

  <text x="50" y="398" font-size="40" font-weight="800" fill="#fff">Orqeva</text>
  <text x="50" y="426" font-size="14" fill="#aaa6c3">AI agent orchestration platform</text>
</svg>
